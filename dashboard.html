<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon tableau de bord — Business Tools</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="index.html"><span class="brand-mark">BT</span> Business Tools</a>
      <nav>
        <a class="btn btn-ghost btn-sm hide-sm" href="index.html">Mes outils</a>
        <button id="btn-logout" class="btn btn-outline btn-sm" type="button">Se déconnecter</button>
      </nav>
    </div>
  </header>

  <main class="wrap dash">
    <section class="hello">
      <div>
        <h1 id="hello">Bonjour 👋</h1>
        <p class="muted">Retrouvez ici tout ce que vous avez enregistré. Ces données sont privées : vous seul y avez accès.</p>
      </div>
      <a class="btn btn-accent" href="index.html">Ouvrir les outils</a>
    </section>

    <div id="banner" class="banner" hidden></div>

    <section class="stats" id="stats" aria-label="Résumé"></section>

    <section class="panel" aria-labelledby="saved-title">
      <h2 id="saved-title">Mes enregistrements</h2>
      <div class="toolbar">
        <div class="chips" id="chips" aria-label="Filtrer par outil"></div>
        <input id="search" type="search" placeholder="Rechercher un titre…" aria-label="Rechercher un enregistrement">
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="grid" id="items"></div>
    </section>

    <section class="panel account" aria-labelledby="account-title">
      <h2 id="account-title">Mon compte</h2>
      <dl id="account"></dl>
    </section>
  </main>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <div class="dlg-in">
      <div>
        <span class="badge" id="dlg-tool"></span>
        <h2 id="dlg-title" style="margin-top:8px"></h2>
        <small class="muted" id="dlg-date"></small>
      </div>
      <pre id="dlg-data"></pre>
      <div class="dlg-actions">
        <button id="dlg-copy" class="btn btn-outline btn-sm" type="button">Copier</button>
        <button id="dlg-close" class="btn btn-primary btn-sm" type="button">Fermer</button>
      </div>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
